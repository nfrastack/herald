name: Build and Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: '1.27.4'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ART: herald_${{ github.ref_name }}_${{ matrix.os }}_${{ matrix.arch }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64}
          - {os: linux, arch: arm64}
          #- { os: darwin, arch: amd64 }
          #- { os: darwin, arch: arm64 }
          #- { os: freebsd, arch: amd64 }
          #- { os: freebsd, arch: arm64 }
          #- { os: openbsd, arch: amd64 }
          #- { os: openbsd, arch: arm64 }
          #- { os: windows, arch: amd64 }
          #- { os: windows, arch: arm64 }

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build Binary
        working-directory: src
        run: |
          CHANNEL=stable
          SUFFIX=""
          if [ "${{ matrix.os }}" = "windows" ]; then SUFFIX=".exe"; fi
          if echo "${{ github.ref_name }}" | grep -qiE \
            '[-._]?(beta|rc|pre|preview)[-._]?[0-9]*$|(b|rc)[0-9]+$'; then
            CHANNEL=beta
          fi
          COMMIT=$(git rev-parse --short=7 HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            OUT=../$ART$SUFFIX
            go build -trimpath \
              -ldflags "-s -w -X main.Version=${{ github.ref_name }} \
              -X main.buildChannel=${CHANNEL} -X main.buildCommit=${COMMIT} \
              -X main.BuildTime=${BUILD_DATE}" \
              -o "$OUT" \
              ./cmd/herald

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}*

      - name: Run unit tests
        working-directory: src
        run: go test -count=1 -short ./...

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: herald_${{ github.ref_name }}_*
          path: dist
          merge-multiple: true

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: |
            dist/herald_${{ github.ref_name }}_*

  container:
    name: Build and Push Container Image
    needs: [build]
    uses: ./.github/workflows/container-build.yml
    with:
      base_image: docker.io/nfrastack/base:alpine_3.24
      platforms: linux/amd64,linux/arm64
    secrets: inherit
